<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      {% if page.url != "/" and page.title %}{{ page.title }} | {% endif %}{{ site.title }}
    </title>

    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    {% if page.keywords %}
      <meta name="keywords" content="{{ page.keywords | escape }}">
    {% endif %}

    {% if page.author %}
      <meta name="author" content="{{ page.author | escape }}">
    {% endif %}

    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/site-nav.css" | relative_url }}">

<!-- Structured Data: WebSite -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Holstonia Bigfoot Investigations",
  "url": "https://holstonia-investigations.org",
  "publisher": {
    "@type": "Organization",
    "name": "Holstonia Bigfoot Investigations",
    "url": "https://holstonia-investigations.org"
  }
}
</script>

<!-- Structured Data: WebPage -->
<!-- Structured Data: WebSite -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Holstonia Bigfoot Investigations",
  "url": "https://holstonia-investigations.org",
  "publisher": {
    "@type": "Organization",
    "name": "Holstonia Bigfoot Investigations",
    "url": "https://holstonia-investigations.org"
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://holstonia-investigations.org/search/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
    
<!-- Structured Data: Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Holstonia Bigfoot Investigations",
  "url": "https://holstonia-investigations.org",
  "description": "Holstonia Bigfoot Investigations is an independent research program examining anomalous biological reports through structured scientific methodology under conditions of uncertainty.",
  "founder": {
    "@type": "Person",
    "name": "Dan Kegley"
  }
}
</script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YX0F9RKFC8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YX0F9RKFC8', { 'anonymize_ip': true });
    </script>
  </head>

  <body>
    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
          {{ site.title | escape }}
        </a>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">

        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="/about">About &amp; Scope</a>
          <a href="/methods">Methods &amp; Framework</a>
          <a href="/research/">Research Papers</a>
          <a href="/field-guide/">Field Guide</a>
          <a href="/reference-library">Reference Library</a>
          <a href="/media-faq">Media &amp; FAQ</a>
          <a href="/contact">Contact</a>
          <a href="/changelog">Changelog &amp; Updates</a>
          <a href="/search/">Search</a>
        </nav>

        {{ content }}

      </div>
    </main>
  </body>
</html>
