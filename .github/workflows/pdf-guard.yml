name: PDF Guardrail

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify PDF targets
        run: |
          missing=0
          for file in _papers/*.md; do
            pdf=$(grep '^pdf:' "$file" | sed 's/pdf:[ ]*//g' | tr -d '"')
            if [ -n "$pdf" ]; then
              path=${pdf#/}
              if [ ! -f "$path" ]; then
                echo "Missing PDF for $file → $pdf"
                missing=1
              fi
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "PDF integrity check FAILED"
            exit 1
          fi
          echo "PDF integrity check PASSED"